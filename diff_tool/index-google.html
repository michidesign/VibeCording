<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テキスト差分比較ツール | Diff Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    /* ==========================================
       CSS Variables - Material Design 3
    ========================================== */
    :root {
      /* Primary */
      --md-sys-color-primary: #6750A4;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #EADDFF;
      --md-sys-color-on-primary-container: #21005D;

      /* Secondary */
      --md-sys-color-secondary: #625B71;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #E8DEF8;
      --md-sys-color-on-secondary-container: #1D192B;

      /* Tertiary */
      --md-sys-color-tertiary: #7D5260;
      --md-sys-color-on-tertiary: #FFFFFF;
      --md-sys-color-tertiary-container: #FFD8E4;
      --md-sys-color-on-tertiary-container: #31111D;

      /* Error */
      --md-sys-color-error: #B3261E;
      --md-sys-color-on-error: #FFFFFF;
      --md-sys-color-error-container: #F9DEDC;
      --md-sys-color-on-error-container: #410E0B;

      /* Surface */
      --md-sys-color-surface: #FFFBFE;
      --md-sys-color-on-surface: #1C1B1F;
      --md-sys-color-surface-variant: #E7E0EC;
      --md-sys-color-on-surface-variant: #49454F;
      --md-sys-color-surface-container: #F3EDF7;
      --md-sys-color-surface-container-high: #ECE6F0;
      --md-sys-color-surface-container-highest: #E6E0E9;
      --md-sys-color-surface-container-low: #F7F2FA;

      /* Outline */
      --md-sys-color-outline: #79747E;
      --md-sys-color-outline-variant: #CAC4D0;

      /* Background */
      --md-sys-color-background: #FFFBFE;
      --md-sys-color-on-background: #1C1B1F;

      /* Diff Colors */
      --diff-added-bg: #D7F5DC;
      --diff-added-container: #C8E6C9;
      --diff-added-text: #1B5E20;
      --diff-added-char: rgba(76, 175, 80, 0.4);
      --diff-removed-bg: #FFEBEE;
      --diff-removed-container: #FFCDD2;
      --diff-removed-text: #B71C1C;
      --diff-removed-char: rgba(244, 67, 54, 0.4);

      /* Typography */
      --md-sys-typescale-font: 'Roboto', 'Noto Sans JP', sans-serif;
      --md-sys-typescale-brand: 'Google Sans', 'Roboto', 'Noto Sans JP', sans-serif;
      --md-sys-typescale-mono: 'Roboto Mono', monospace;

      /* Motion */
      --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
      --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
      --md-sys-motion-duration-short1: 50ms;
      --md-sys-motion-duration-short2: 100ms;
      --md-sys-motion-duration-medium1: 200ms;
      --md-sys-motion-duration-medium2: 300ms;
      --md-sys-motion-duration-long1: 400ms;

      /* Shape */
      --md-sys-shape-corner-none: 0;
      --md-sys-shape-corner-extra-small: 4px;
      --md-sys-shape-corner-small: 8px;
      --md-sys-shape-corner-medium: 12px;
      --md-sys-shape-corner-large: 16px;
      --md-sys-shape-corner-extra-large: 28px;
      --md-sys-shape-corner-full: 9999px;

      /* Elevation */
      --md-sys-elevation-level0: none;
      --md-sys-elevation-level1: 0 1px 2px rgba(0,0,0,0.1), 0 1px 3px 1px rgba(0,0,0,0.06);
      --md-sys-elevation-level2: 0 1px 2px rgba(0,0,0,0.12), 0 2px 6px 2px rgba(0,0,0,0.06);
      --md-sys-elevation-level3: 0 4px 8px 3px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.12);
    }

    /* Dark Theme */
    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-primary: #D0BCFF;
        --md-sys-color-on-primary: #381E72;
        --md-sys-color-primary-container: #4F378B;
        --md-sys-color-on-primary-container: #EADDFF;

        --md-sys-color-secondary: #CCC2DC;
        --md-sys-color-on-secondary: #332D41;
        --md-sys-color-secondary-container: #4A4458;
        --md-sys-color-on-secondary-container: #E8DEF8;

        --md-sys-color-surface: #1C1B1F;
        --md-sys-color-on-surface: #E6E1E5;
        --md-sys-color-surface-variant: #49454F;
        --md-sys-color-on-surface-variant: #CAC4D0;
        --md-sys-color-surface-container: #211F26;
        --md-sys-color-surface-container-high: #2B2930;
        --md-sys-color-surface-container-highest: #36343B;
        --md-sys-color-surface-container-low: #1D1B20;

        --md-sys-color-outline: #938F99;
        --md-sys-color-outline-variant: #49454F;

        --md-sys-color-background: #1C1B1F;
        --md-sys-color-on-background: #E6E1E5;

        --diff-added-bg: rgba(76, 175, 80, 0.2);
        --diff-added-text: #81C784;
        --diff-removed-bg: rgba(244, 67, 54, 0.2);
        --diff-removed-text: #EF9A9A;
      }
    }

    /* ==========================================
       Base Styles
    ========================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--md-sys-typescale-font);
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: 0.25px;
      color: var(--md-sys-color-on-background);
      background: var(--md-sys-color-background);
      min-height: 100vh;
    }

    /* Material Symbols */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      vertical-align: middle;
    }

    /* ==========================================
       Skip Link (Accessibility)
    ========================================== */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      text-decoration: none;
      border-radius: var(--md-sys-shape-corner-small);
      z-index: 1000;
      transition: top var(--md-sys-motion-duration-medium1) var(--md-sys-motion-easing-standard);
    }

    .skip-link:focus {
      top: 16px;
    }

    /* ==========================================
       Top App Bar
    ========================================== */
    .top-app-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--md-sys-color-surface);
      box-shadow: var(--md-sys-elevation-level2);
    }

    .top-app-bar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
    }

    .top-app-bar-title {
      margin: 0;
      font-family: var(--md-sys-typescale-font);
      font-size: 22px;
      font-weight: 400;
      line-height: 28px;
      color: var(--md-sys-color-on-surface);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-app-bar-title .material-symbols-outlined {
      color: var(--md-sys-color-primary);
      font-size: 28px;
    }

    .top-app-bar-actions {
      display: flex;
      gap: 8px;
    }

    /* ==========================================
       Buttons (Material Design 3)
    ========================================== */
    .md-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      padding: 0 24px;
      font-family: var(--md-sys-typescale-font);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1px;
      line-height: 20px;
      text-decoration: none;
      border: none;
      border-radius: var(--md-sys-shape-corner-full);
      cursor: pointer;
      overflow: hidden;
      transition: box-shadow var(--md-sys-motion-duration-medium1) var(--md-sys-motion-easing-standard);
    }

    .md-btn:focus-visible {
      outline: 2px solid var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    /* Ripple Effect */
    .md-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity var(--md-sys-motion-duration-short2) var(--md-sys-motion-easing-standard);
    }

    .md-btn:hover::after {
      opacity: 0.08;
    }

    .md-btn:active::after {
      opacity: 0.12;
    }

    /* Filled Button */
    .md-btn-filled {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    .md-btn-filled:hover {
      box-shadow: var(--md-sys-elevation-level1);
    }

    /* Tonal Button */
    .md-btn-tonal {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .md-btn-tonal:hover {
      box-shadow: var(--md-sys-elevation-level1);
    }

    .md-btn-tonal.active {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    /* Text Button */
    .md-btn-text {
      background: transparent;
      color: var(--md-sys-color-primary);
      padding: 0 12px;
    }

    /* Icon Button */
    .md-btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: var(--md-sys-shape-corner-full);
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ==========================================
       Main Container
    ========================================== */
    .main-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    /* ==========================================
       Section Title
    ========================================== */
    .section-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
      margin: 0 0 16px;
      padding-left: 16px;
    }

    /* ==========================================
       Editor Section
    ========================================== */
    .editor-section {
      margin-bottom: 24px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Card (Elevated) */
    .md-card {
      background: var(--md-sys-color-surface);
      border-radius: var(--md-sys-shape-corner-medium);
      box-shadow: var(--md-sys-elevation-level1);
      overflow: hidden;
    }

    .editor-pane {
      display: flex;
      flex-direction: column;
      transition: box-shadow var(--md-sys-motion-duration-medium2) var(--md-sys-motion-easing-standard);
    }

    .editor-pane:focus-within {
      box-shadow: var(--md-sys-elevation-level3);
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--md-sys-color-surface-container-low);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .editor-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .editor-label .material-symbols-outlined {
      font-size: 20px;
    }

    .editor-label .material-symbols-outlined.left {
      color: var(--diff-removed-text);
    }

    .editor-label .material-symbols-outlined.right {
      color: var(--diff-added-text);
    }

    .editor-char-count {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      font-variant-numeric: tabular-nums;
    }

    .editor-textarea {
      width: 100%;
      min-height: 280px;
      padding: 16px;
      font-family: var(--md-sys-typescale-mono);
      font-size: 14px;
      line-height: 1.6;
      color: var(--md-sys-color-on-surface);
      background: var(--md-sys-color-surface);
      border: none;
      resize: vertical;
      outline: none;
    }

    .editor-textarea::placeholder {
      color: var(--md-sys-color-on-surface-variant);
    }

    /* ==========================================
       Results Section
    ========================================== */
    .results-card {
      background: var(--md-sys-color-surface);
      border-radius: var(--md-sys-shape-corner-large);
      box-shadow: var(--md-sys-elevation-level1);
      overflow: hidden;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--md-sys-color-surface-container-low);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      flex-wrap: wrap;
      gap: 16px;
    }

    .results-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .results-title .material-symbols-outlined {
      color: var(--md-sys-color-primary);
    }

    .results-stats {
      display: flex;
      gap: 16px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Chips (Filter Chip style) */
    .stat-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--md-sys-shape-corner-small);
      font-variant-numeric: tabular-nums;
    }

    .stat-chip.added {
      background: var(--diff-added-bg);
      color: var(--diff-added-text);
    }

    .stat-chip.removed {
      background: var(--diff-removed-bg);
      color: var(--diff-removed-text);
    }

    .stat-chip.unchanged {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Segmented Button */
    .segmented-button {
      display: flex;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-sys-shape-corner-full);
      overflow: hidden;
    }

    .segmented-button .segment {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 16px;
      font-family: var(--md-sys-typescale-font);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1px;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      border: none;
      cursor: pointer;
      transition: all var(--md-sys-motion-duration-medium1) var(--md-sys-motion-easing-standard);
    }

    .segmented-button .segment:not(:last-child) {
      border-right: 1px solid var(--md-sys-color-outline);
    }

    .segmented-button .segment::after {
      content: '';
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity var(--md-sys-motion-duration-short2);
    }

    .segmented-button .segment:hover::after {
      opacity: 0.08;
    }

    .segmented-button .segment.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .segmented-button .segment:focus-visible {
      outline: 2px solid var(--md-sys-color-primary);
      outline-offset: -2px;
    }

    /* ==========================================
       Diff Display
    ========================================== */
    .diff-container {
      overflow-x: auto;
    }

    .diff-empty {
      padding: 64px 24px;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
    }

    .diff-empty .material-symbols-outlined {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .diff-empty-text {
      font-size: 16px;
      line-height: 24px;
    }

    /* Side by Side View */
    .diff-side-by-side {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 768px) {
      .diff-side-by-side {
        grid-template-columns: 1fr;
      }
    }

    .diff-side {
      border-right: 1px solid var(--md-sys-color-outline-variant);
    }

    .diff-side:last-child {
      border-right: none;
    }

    /* Inline View */
    .diff-inline {
      width: 100%;
    }

    /* Diff Lines */
    .diff-line {
      display: flex;
      font-family: var(--md-sys-typescale-mono);
      font-size: 13px;
      line-height: 1.6;
      min-height: 24px;
    }

    .diff-line-number {
      flex-shrink: 0;
      width: 48px;
      padding: 0 8px;
      text-align: right;
      color: var(--md-sys-color-on-surface-variant);
      background: var(--md-sys-color-surface-container);
      border-right: 1px solid var(--md-sys-color-outline-variant);
      user-select: none;
      font-variant-numeric: tabular-nums;
    }

    .diff-line-marker {
      flex-shrink: 0;
      width: 24px;
      text-align: center;
      font-weight: 500;
      user-select: none;
    }

    .diff-line-content {
      flex: 1;
      padding: 0 16px;
      white-space: pre-wrap;
      word-break: break-all;
      min-width: 0;
    }

    /* Line States */
    .diff-line.added {
      background: var(--diff-added-bg);
    }

    .diff-line.added .diff-line-marker {
      color: var(--diff-added-text);
    }

    .diff-line.removed {
      background: var(--diff-removed-bg);
    }

    .diff-line.removed .diff-line-marker {
      color: var(--diff-removed-text);
    }

    .diff-line.unchanged {
      background: var(--md-sys-color-surface);
    }

    .diff-line.unchanged .diff-line-marker {
      color: var(--md-sys-color-on-surface-variant);
    }

    .diff-line.empty {
      background: var(--md-sys-color-surface-container);
    }

    .diff-line.empty .diff-line-content {
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Character-level highlights */
    .diff-char-added {
      background: var(--diff-added-char);
      border-radius: 2px;
    }

    .diff-char-removed {
      background: var(--diff-removed-char);
      border-radius: 2px;
    }

    /* ==========================================
       Footer
    ========================================== */
    .footer {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 12px;
    }

    /* ==========================================
       Utilities
    ========================================== */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ==========================================
       Animations
    ========================================== */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .diff-line {
      animation: fadeIn var(--md-sys-motion-duration-medium2) var(--md-sys-motion-easing-emphasized) forwards;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Skip Link -->
  <a href="#main-content" class="skip-link">本文へスキップ</a>

  <!-- Top App Bar -->
  <header class="top-app-bar" role="banner">
    <div class="top-app-bar-inner">
      <h1 class="top-app-bar-title">
        <span class="material-symbols-outlined" aria-hidden="true">compare</span>
        テキスト差分比較ツール
      </h1>
      <div class="top-app-bar-actions">
        <button type="button" class="md-btn md-btn-text" id="clearBtn" aria-label="入力をクリア">
          <span class="material-symbols-outlined" aria-hidden="true">delete</span>
          クリア
        </button>
        <button type="button" class="md-btn md-btn-tonal" id="swapBtn" aria-label="左右を入れ替え">
          <span class="material-symbols-outlined" aria-hidden="true">swap_horiz</span>
          入れ替え
        </button>
        <button type="button" class="md-btn md-btn-filled" id="compareBtn">
          <span class="material-symbols-outlined" aria-hidden="true">difference</span>
          比較する
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="main-content" role="main">
    <!-- Editor Section -->
    <section class="editor-section" aria-labelledby="editor-heading">
      <h2 id="editor-heading" class="visually-hidden">テキスト入力</h2>
      <div class="editor-grid">
        <!-- Left Editor -->
        <div class="md-card editor-pane">
          <div class="editor-header">
            <label for="leftText" class="editor-label">
              <span class="material-symbols-outlined left" aria-hidden="true">description</span>
              元のテキスト
            </label>
            <span class="editor-char-count" id="leftCount">0 文字</span>
          </div>
          <textarea
            id="leftText"
            class="editor-textarea"
            placeholder="比較元のテキストを入力..."
            spellcheck="false"
            aria-describedby="leftCount"
          ></textarea>
        </div>
        <!-- Right Editor -->
        <div class="md-card editor-pane">
          <div class="editor-header">
            <label for="rightText" class="editor-label">
              <span class="material-symbols-outlined right" aria-hidden="true">edit_document</span>
              変更後のテキスト
            </label>
            <span class="editor-char-count" id="rightCount">0 文字</span>
          </div>
          <textarea
            id="rightText"
            class="editor-textarea"
            placeholder="比較先のテキストを入力..."
            spellcheck="false"
            aria-describedby="rightCount"
          ></textarea>
        </div>
      </div>
    </section>

    <!-- Results Section -->
    <section class="results-card" aria-labelledby="results-heading">
      <div class="results-header">
        <h2 id="results-heading" class="results-title">
          <span class="material-symbols-outlined" aria-hidden="true">analytics</span>
          比較結果
        </h2>
        <div class="results-stats" id="resultStats" aria-live="polite">
          <span class="stat-item">
            <span class="stat-chip added" id="addedCount">0</span>
            追加
          </span>
          <span class="stat-item">
            <span class="stat-chip removed" id="removedCount">0</span>
            削除
          </span>
          <span class="stat-item">
            <span class="stat-chip unchanged" id="unchangedCount">0</span>
            変更なし
          </span>
        </div>
        <div class="segmented-button" role="tablist" aria-label="表示形式の切り替え">
          <button
            type="button"
            class="segment active"
            role="tab"
            aria-selected="true"
            aria-controls="diffOutput"
            id="sideBySideTab"
            data-view="side-by-side"
          >
            左右表示
          </button>
          <button
            type="button"
            class="segment"
            role="tab"
            aria-selected="false"
            aria-controls="diffOutput"
            id="inlineTab"
            data-view="inline"
          >
            統合表示
          </button>
        </div>
      </div>
      <div class="diff-container" id="diffOutput" role="tabpanel" aria-labelledby="sideBySideTab">
        <div class="diff-empty">
          <span class="material-symbols-outlined" aria-hidden="true">compare_arrows</span>
          <p class="diff-empty-text">テキストを入力して「比較する」ボタンをクリックしてください</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <p>キーボードショートカット: Ctrl/Cmd + Enter で比較実行</p>
  </footer>

  <script>
    // ==========================================
    // DOM Elements
    // ==========================================
    const leftText = document.getElementById('leftText');
    const rightText = document.getElementById('rightText');
    const leftCount = document.getElementById('leftCount');
    const rightCount = document.getElementById('rightCount');
    const compareBtn = document.getElementById('compareBtn');
    const clearBtn = document.getElementById('clearBtn');
    const swapBtn = document.getElementById('swapBtn');
    const diffOutput = document.getElementById('diffOutput');
    const addedCountEl = document.getElementById('addedCount');
    const removedCountEl = document.getElementById('removedCount');
    const unchangedCountEl = document.getElementById('unchangedCount');
    const sideBySideTab = document.getElementById('sideBySideTab');
    const inlineTab = document.getElementById('inlineTab');

    let currentView = 'side-by-side';
    let currentDiff = null;

    // ==========================================
    // Diff Algorithm (Myers-like LCS based)
    // ==========================================
    function computeLCS(arr1, arr2) {
      const m = arr1.length;
      const n = arr2.length;
      const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (arr1[i - 1] === arr2[j - 1]) {
            dp[i][j] = dp[i - 1][j - 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
      }

      const lcs = [];
      let i = m, j = n;
      while (i > 0 && j > 0) {
        if (arr1[i - 1] === arr2[j - 1]) {
          lcs.unshift({ value: arr1[i - 1], leftIndex: i - 1, rightIndex: j - 1 });
          i--; j--;
        } else if (dp[i - 1][j] > dp[i][j - 1]) {
          i--;
        } else {
          j--;
        }
      }

      return lcs;
    }

    function computeDiff(leftLines, rightLines) {
      const lcs = computeLCS(leftLines, rightLines);
      const diff = [];

      let leftIdx = 0;
      let rightIdx = 0;
      let lcsIdx = 0;

      while (leftIdx < leftLines.length || rightIdx < rightLines.length) {
        if (lcsIdx < lcs.length) {
          const lcsItem = lcs[lcsIdx];

          while (leftIdx < lcsItem.leftIndex) {
            diff.push({
              type: 'removed',
              leftLine: leftIdx + 1,
              rightLine: null,
              content: leftLines[leftIdx]
            });
            leftIdx++;
          }

          while (rightIdx < lcsItem.rightIndex) {
            diff.push({
              type: 'added',
              leftLine: null,
              rightLine: rightIdx + 1,
              content: rightLines[rightIdx]
            });
            rightIdx++;
          }

          diff.push({
            type: 'unchanged',
            leftLine: leftIdx + 1,
            rightLine: rightIdx + 1,
            content: leftLines[leftIdx]
          });
          leftIdx++;
          rightIdx++;
          lcsIdx++;
        } else {
          while (leftIdx < leftLines.length) {
            diff.push({
              type: 'removed',
              leftLine: leftIdx + 1,
              rightLine: null,
              content: leftLines[leftIdx]
            });
            leftIdx++;
          }
          while (rightIdx < rightLines.length) {
            diff.push({
              type: 'added',
              leftLine: null,
              rightLine: rightIdx + 1,
              content: rightLines[rightIdx]
            });
            rightIdx++;
          }
        }
      }

      return diff;
    }

    function computeCharDiff(str1, str2) {
      const chars1 = str1.split('');
      const chars2 = str2.split('');
      const lcs = computeLCS(chars1, chars2);

      let result1 = '';
      let result2 = '';
      let idx1 = 0, idx2 = 0, lcsIdx = 0;

      while (idx1 < chars1.length || idx2 < chars2.length) {
        if (lcsIdx < lcs.length) {
          const lcsItem = lcs[lcsIdx];

          while (idx1 < lcsItem.leftIndex) {
            result1 += `<span class="diff-char-removed">${escapeHtml(chars1[idx1])}</span>`;
            idx1++;
          }

          while (idx2 < lcsItem.rightIndex) {
            result2 += `<span class="diff-char-added">${escapeHtml(chars2[idx2])}</span>`;
            idx2++;
          }

          result1 += escapeHtml(chars1[idx1]);
          result2 += escapeHtml(chars2[idx2]);
          idx1++; idx2++; lcsIdx++;
        } else {
          while (idx1 < chars1.length) {
            result1 += `<span class="diff-char-removed">${escapeHtml(chars1[idx1])}</span>`;
            idx1++;
          }
          while (idx2 < chars2.length) {
            result2 += `<span class="diff-char-added">${escapeHtml(chars2[idx2])}</span>`;
            idx2++;
          }
        }
      }

      return { left: result1, right: result2 };
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderSideBySide(diff) {
      const leftLines = [];
      const rightLines = [];

      let i = 0;
      while (i < diff.length) {
        const item = diff[i];

        if (item.type === 'unchanged') {
          leftLines.push({ ...item, type: 'unchanged' });
          rightLines.push({ ...item, type: 'unchanged' });
          i++;
        } else if (item.type === 'removed') {
          const removedGroup = [];
          const addedGroup = [];

          while (i < diff.length && diff[i].type === 'removed') {
            removedGroup.push(diff[i]);
            i++;
          }
          while (i < diff.length && diff[i].type === 'added') {
            addedGroup.push(diff[i]);
            i++;
          }

          const maxLen = Math.max(removedGroup.length, addedGroup.length);
          for (let j = 0; j < maxLen; j++) {
            const removed = removedGroup[j];
            const added = addedGroup[j];

            if (removed && added) {
              const charDiff = computeCharDiff(removed.content, added.content);
              leftLines.push({ ...removed, highlightedContent: charDiff.left });
              rightLines.push({ ...added, highlightedContent: charDiff.right });
            } else if (removed) {
              leftLines.push(removed);
              rightLines.push({ type: 'empty', content: '' });
            } else if (added) {
              leftLines.push({ type: 'empty', content: '' });
              rightLines.push(added);
            }
          }
        } else if (item.type === 'added') {
          leftLines.push({ type: 'empty', content: '' });
          rightLines.push(item);
          i++;
        }
      }

      let html = '<div class="diff-side-by-side">';

      html += '<div class="diff-side">';
      leftLines.forEach((line, idx) => {
        const lineNum = line.leftLine || '';
        const marker = line.type === 'removed' ? '−' : line.type === 'empty' ? '' : ' ';
        const content = line.highlightedContent || escapeHtml(line.content);
        html += `
          <div class="diff-line ${line.type}" style="animation-delay: ${idx * 10}ms">
            <span class="diff-line-number">${lineNum}</span>
            <span class="diff-line-marker">${marker}</span>
            <span class="diff-line-content">${content || '&nbsp;'}</span>
          </div>
        `;
      });
      html += '</div>';

      html += '<div class="diff-side">';
      rightLines.forEach((line, idx) => {
        const lineNum = line.rightLine || '';
        const marker = line.type === 'added' ? '+' : line.type === 'empty' ? '' : ' ';
        const content = line.highlightedContent || escapeHtml(line.content);
        html += `
          <div class="diff-line ${line.type}" style="animation-delay: ${idx * 10}ms">
            <span class="diff-line-number">${lineNum}</span>
            <span class="diff-line-marker">${marker}</span>
            <span class="diff-line-content">${content || '&nbsp;'}</span>
          </div>
        `;
      });
      html += '</div>';

      html += '</div>';
      return html;
    }

    function renderInline(diff) {
      let html = '<div class="diff-inline">';

      diff.forEach((line, idx) => {
        const leftNum = line.leftLine || '';
        const rightNum = line.rightLine || '';
        let marker = ' ';
        if (line.type === 'added') marker = '+';
        if (line.type === 'removed') marker = '−';

        const content = escapeHtml(line.content);

        html += `
          <div class="diff-line ${line.type}" style="animation-delay: ${idx * 10}ms">
            <span class="diff-line-number">${leftNum}</span>
            <span class="diff-line-number">${rightNum}</span>
            <span class="diff-line-marker">${marker}</span>
            <span class="diff-line-content">${content || '&nbsp;'}</span>
          </div>
        `;
      });

      html += '</div>';
      return html;
    }

    function renderDiff() {
      if (!currentDiff || currentDiff.length === 0) {
        diffOutput.innerHTML = `
          <div class="diff-empty">
            <span class="material-symbols-outlined" aria-hidden="true">check_circle</span>
            <p class="diff-empty-text">テキストは同一です（差分なし）</p>
          </div>
        `;
        return;
      }

      if (currentView === 'side-by-side') {
        diffOutput.innerHTML = renderSideBySide(currentDiff);
      } else {
        diffOutput.innerHTML = renderInline(currentDiff);
      }
    }

    function updateCharCount(textarea, countEl) {
      const count = textarea.value.length;
      countEl.textContent = `${count.toLocaleString()} 文字`;
    }

    function performComparison() {
      const left = leftText.value;
      const right = rightText.value;

      if (!left && !right) {
        diffOutput.innerHTML = `
          <div class="diff-empty">
            <span class="material-symbols-outlined" aria-hidden="true">compare_arrows</span>
            <p class="diff-empty-text">テキストを入力して「比較する」ボタンをクリックしてください</p>
          </div>
        `;
        addedCountEl.textContent = '0';
        removedCountEl.textContent = '0';
        unchangedCountEl.textContent = '0';
        return;
      }

      const leftLines = left.split('\n');
      const rightLines = right.split('\n');

      currentDiff = computeDiff(leftLines, rightLines);

      const stats = currentDiff.reduce((acc, item) => {
        acc[item.type] = (acc[item.type] || 0) + 1;
        return acc;
      }, {});

      addedCountEl.textContent = stats.added || 0;
      removedCountEl.textContent = stats.removed || 0;
      unchangedCountEl.textContent = stats.unchanged || 0;

      renderDiff();
    }

    function handleViewChange(view) {
      currentView = view;

      sideBySideTab.classList.toggle('active', view === 'side-by-side');
      sideBySideTab.setAttribute('aria-selected', view === 'side-by-side');
      inlineTab.classList.toggle('active', view === 'inline');
      inlineTab.setAttribute('aria-selected', view === 'inline');

      diffOutput.setAttribute('aria-labelledby', view === 'side-by-side' ? 'sideBySideTab' : 'inlineTab');

      if (currentDiff) {
        renderDiff();
      }
    }

    function clearAll() {
      leftText.value = '';
      rightText.value = '';
      updateCharCount(leftText, leftCount);
      updateCharCount(rightText, rightCount);
      currentDiff = null;
      diffOutput.innerHTML = `
        <div class="diff-empty">
          <span class="material-symbols-outlined" aria-hidden="true">compare_arrows</span>
          <p class="diff-empty-text">テキストを入力して「比較する」ボタンをクリックしてください</p>
        </div>
      `;
      addedCountEl.textContent = '0';
      removedCountEl.textContent = '0';
      unchangedCountEl.textContent = '0';
      leftText.focus();
    }

    function swapTexts() {
      const temp = leftText.value;
      leftText.value = rightText.value;
      rightText.value = temp;
      updateCharCount(leftText, leftCount);
      updateCharCount(rightText, rightCount);
      if (currentDiff) {
        performComparison();
      }
    }

    // Event Listeners
    leftText.addEventListener('input', () => updateCharCount(leftText, leftCount));
    rightText.addEventListener('input', () => updateCharCount(rightText, rightCount));

    compareBtn.addEventListener('click', performComparison);
    clearBtn.addEventListener('click', clearAll);
    swapBtn.addEventListener('click', swapTexts);

    sideBySideTab.addEventListener('click', () => handleViewChange('side-by-side'));
    inlineTab.addEventListener('click', () => handleViewChange('inline'));

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        performComparison();
      }
    });

    // Initialize
    updateCharCount(leftText, leftCount);
    updateCharCount(rightText, rightCount);
  </script>
</body>
</html>
