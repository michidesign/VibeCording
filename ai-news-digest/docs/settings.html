<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Digest - 設定</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* DADS カラーパレット */
            --dads-primary-500: #0071c1;
            --dads-primary-600: #005bb4;
            --dads-primary-700: #004c96;
            --dads-primary-50: #e8f3fc;

            --dads-text-primary: #212529;
            --dads-text-secondary: #495057;
            --dads-text-muted: #6c757d;
            --dads-text-link: #0071c1;

            --dads-bg-primary: #ffffff;
            --dads-bg-secondary: #f8f9fa;
            --dads-bg-tertiary: #e9ecef;
            --dads-border-light: #dee2e6;
            --dads-border-default: #ced4da;

            /* セマンティックカラー */
            --dads-success: #28a745;
            --dads-success-light: #d4edda;
            --dads-error: #dc3545;
            --dads-error-light: #f8d7da;
            --dads-info: #17a2b8;
            --dads-info-light: #cce5ff;

            /* スペーシング（8px基準） */
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-8: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 100%;
        }

        body {
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
            background: var(--dads-bg-secondary);
            color: var(--dads-text-primary);
            line-height: 1.75;
            min-height: 100vh;
            font-size: 16px;
        }

        /* スキップリンク */
        .skip-link {
            position: absolute;
            top: -100px;
            left: 0;
            background: var(--dads-primary-500);
            color: #ffffff;
            padding: var(--space-3) var(--space-4);
            z-index: 1000;
            text-decoration: none;
            font-weight: 700;
        }

        .skip-link:focus {
            top: 0;
        }

        .header {
            background: var(--dads-bg-primary);
            border-bottom: 1px solid var(--dads-border-light);
            padding: var(--space-4);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--dads-primary-500);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dads-primary-500);
        }

        .back-link {
            color: var(--dads-text-link);
            text-decoration: underline;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--dads-primary-700);
        }

        .back-link:focus-visible {
            outline: 3px solid var(--dads-primary-500);
            outline-offset: 2px;
        }

        .main {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--space-6) var(--space-4);
        }

        .section {
            background: var(--dads-bg-primary);
            border: 1px solid var(--dads-border-light);
            border-radius: 8px;
            padding: var(--space-5);
            margin-bottom: var(--space-5);
        }

        .section-title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .form-label {
            display: block;
            font-size: 1rem;
            font-weight: 700;
            color: var(--dads-text-primary);
            margin-bottom: var(--space-2);
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            background: var(--dads-bg-primary);
            border: 2px solid var(--dads-border-default);
            border-radius: 4px;
            color: var(--dads-text-primary);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.5;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:hover,
        .form-select:hover {
            border-color: var(--dads-border-light);
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--dads-primary-500);
            box-shadow: 0 0 0 3px rgba(0, 113, 193, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-4);
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 2fr 3fr 1fr;
            gap: var(--space-3);
            align-items: end;
        }

        .form-help {
            font-size: 0.875rem;
            color: var(--dads-text-muted);
            margin-top: var(--space-2);
        }

        .source-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .source-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3);
            background: var(--dads-bg-secondary);
            border-radius: 4px;
            margin-bottom: var(--space-2);
        }

        .source-item.custom {
            border: 1px solid var(--dads-primary-500);
        }

        .source-checkbox {
            width: 24px;
            height: 24px;
            accent-color: var(--dads-primary-500);
            flex-shrink: 0;
            cursor: pointer;
        }

        .source-info {
            flex: 1;
            min-width: 0;
        }

        .source-name {
            font-weight: 500;
            font-size: 1rem;
        }

        .source-url {
            font-size: 0.75rem;
            color: var(--dads-text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .source-lang {
            font-size: 0.75rem;
            padding: 4px 8px;
            background: var(--dads-primary-50);
            border-radius: 4px;
            color: var(--dads-text-secondary);
            flex-shrink: 0;
        }

        .source-lang.ja {
            background: var(--dads-error-light);
            color: var(--dads-error);
        }

        .source-delete {
            background: none;
            border: none;
            color: var(--dads-text-muted);
            cursor: pointer;
            padding: var(--space-2);
            font-size: 1rem;
            min-height: 48px;
            display: flex;
            align-items: center;
        }

        .source-delete:hover {
            color: var(--dads-error);
        }

        .source-delete:focus-visible {
            outline: 3px solid var(--dads-primary-500);
            outline-offset: 2px;
        }

        .add-source-form {
            background: var(--dads-bg-secondary);
            border-radius: 4px;
            padding: var(--space-4);
            margin-top: var(--space-4);
        }

        .add-source-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dads-primary-500);
            margin-bottom: var(--space-3);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-3) var(--space-5);
            border: 2px solid transparent;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            min-height: 48px;
            transition: all 0.2s;
        }

        .btn:focus-visible {
            outline: 3px solid var(--dads-primary-500);
            outline-offset: 2px;
        }

        .btn-sm {
            padding: var(--space-2) var(--space-4);
            font-size: 0.875rem;
            min-height: 36px;
        }

        .btn-primary {
            background: var(--dads-primary-500);
            border-color: var(--dads-primary-500);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--dads-primary-700);
            border-color: var(--dads-primary-700);
        }

        .btn-secondary {
            background: var(--dads-bg-primary);
            color: var(--dads-text-primary);
            border-color: var(--dads-border-default);
        }

        .btn-secondary:hover {
            background: var(--dads-bg-secondary);
            border-color: var(--dads-primary-500);
        }

        .btn-success {
            background: var(--dads-success);
            border-color: var(--dads-success);
            color: #ffffff;
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        .actions {
            display: flex;
            gap: var(--space-4);
            justify-content: flex-end;
            margin-top: var(--space-6);
        }

        .alert {
            padding: var(--space-4);
            border-radius: 4px;
            margin-bottom: var(--space-4);
            font-size: 0.875rem;
            border-left: 4px solid;
        }

        .alert-info {
            background: var(--dads-info-light);
            border-left-color: var(--dads-info);
            color: var(--dads-text-primary);
        }

        .alert-success {
            background: var(--dads-success-light);
            border-left-color: var(--dads-success);
            color: var(--dads-text-primary);
        }

        .hidden {
            display: none;
        }

        .tab-buttons {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }

        .tab-btn {
            padding: var(--space-2) var(--space-4);
            background: var(--dads-bg-secondary);
            border: 1px solid var(--dads-border-default);
            border-radius: 4px;
            color: var(--dads-text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            min-height: 48px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            border-color: var(--dads-primary-500);
        }

        .tab-btn:focus-visible {
            outline: 3px solid var(--dads-primary-500);
            outline-offset: 2px;
        }

        .tab-btn.active {
            background: var(--dads-primary-500);
            border-color: var(--dads-primary-500);
            color: #ffffff;
        }

        /* ダークモード */
        [data-theme="dark"] {
            --dads-text-primary: #f1f3f5;
            --dads-text-secondary: #ced4da;
            --dads-text-muted: #adb5bd;
            --dads-text-link: #6aade7;
            --dads-bg-primary: #212529;
            --dads-bg-secondary: #343a40;
            --dads-bg-tertiary: #495057;
            --dads-border-light: #495057;
            --dads-border-default: #6c757d;
            --dads-primary-50: rgba(0, 113, 193, 0.15);
            --dads-success-light: rgba(40, 167, 69, 0.15);
            --dads-error-light: rgba(220, 53, 69, 0.15);
            --dads-info-light: rgba(23, 162, 184, 0.15);
        }

        [data-theme="dark"] .source-lang.ja {
            background: rgba(220, 53, 69, 0.15);
            color: #f8d7da;
        }

        .theme-toggle {
            background: var(--dads-bg-secondary);
            border: 1px solid var(--dads-border-default);
            border-radius: 4px;
            padding: var(--space-2) var(--space-3);
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 1rem;
            color: var(--dads-text-secondary);
            min-height: 48px;
        }

        .theme-toggle:hover {
            background: var(--dads-primary-50);
            border-color: var(--dads-primary-500);
        }

        .theme-toggle:focus-visible {
            outline: 3px solid var(--dads-primary-500);
            outline-offset: 2px;
        }

        @media (max-width: 576px) {

            .form-row,
            .form-row-3 {
                grid-template-columns: 1fr;
            }

            .header-content {
                flex-direction: column;
                gap: var(--space-3);
            }
        }
    </style>
</head>

<body>
    <a href="#main-content" class="skip-link">本文へスキップ</a>

    <header class="header" role="banner">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">⚙️</div>
                <span class="logo-text">設定</span>
            </div>
            <div style="display: flex; align-items: center; gap: var(--space-4);">
                <a href="index.html" class="back-link">← ニュース一覧に戻る</a>
                <button class="theme-toggle" onclick="toggleTheme()" title="テーマ切り替え" aria-label="テーマ切り替え">
                    <span id="theme-icon">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <main id="main-content" class="main" role="main">
        <div class="alert alert-info">
            💡 この設定画面で変更した内容は、<code>config/settings.json</code>ファイルに保存されます。
            変更を反映するには、GitHubにプッシュしてください。
        </div>

        <div id="saveAlert" class="alert alert-success hidden">
            ✅ 設定を保存しました！下記のJSONをコピーして<code>config/settings.json</code>に貼り付けてください。
        </div>

        <form id="settingsForm">
            <!-- スケジュール設定 -->
            <section class="section">
                <h2 class="section-title">⏰ 配信スケジュール</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="scheduleHour">配信時刻（時）</label>
                        <input type="number" class="form-input" id="scheduleHour" min="0" max="23" value="6">
                        <p class="form-help">0〜23の範囲で指定（日本時間）</p>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="scheduleMinute">配信時刻（分）</label>
                        <input type="number" class="form-input" id="scheduleMinute" min="0" max="59" value="0">
                    </div>
                </div>
            </section>

            <!-- 出力設定 -->
            <section class="section">
                <h2 class="section-title">📰 出力設定</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="maxArticles">記事数</label>
                        <input type="number" class="form-input" id="maxArticles" min="1" max="10" value="5">
                        <p class="form-help">配信する記事の本数（1〜10）</p>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="hoursLimit">収集期間（時間）</label>
                        <input type="number" class="form-input" id="hoursLimit" min="12" max="168" value="48">
                        <p class="form-help">何時間以内の記事を対象にするか</p>
                    </div>
                </div>
            </section>

            <!-- ニュースソース設定 -->
            <section class="section">
                <h2 class="section-title">📡 ニュースソース</h2>

                <div class="tab-buttons">
                    <button type="button" class="tab-btn active" data-tab="ja">🇯🇵 日本語ソース</button>
                    <button type="button" class="tab-btn" data-tab="en">🌐 英語ソース</button>
                    <button type="button" class="tab-btn" data-tab="custom">➕ カスタム</button>
                </div>

                <ul class="source-list" id="sourceList">
                    <!-- JavaScript で動的に生成 -->
                </ul>

                <!-- カスタムソース追加フォーム -->
                <div class="add-source-form" id="addSourceForm">
                    <div class="add-source-title">
                        ➕ 新しいソースを追加
                    </div>
                    <div class="form-row-3">
                        <div class="form-group">
                            <label class="form-label" for="newSourceName">ソース名</label>
                            <input type="text" class="form-input" id="newSourceName" placeholder="例: Tech Blog">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="newSourceUrl">RSS フィード URL</label>
                            <input type="url" class="form-input" id="newSourceUrl"
                                placeholder="https://example.com/feed.xml">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="newSourceLang">言語</label>
                            <select class="form-select" id="newSourceLang">
                                <option value="ja">🇯🇵 日本語</option>
                                <option value="en">🌐 English</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="btn btn-success btn-sm" onclick="addCustomSource()">
                        ＋ ソースを追加
                    </button>
                </div>
            </section>

            <div class="actions">
                <button type="button" class="btn btn-secondary" onclick="resetSettings()">
                    リセット
                </button>
                <button type="submit" class="btn btn-primary">
                    💾 設定を保存
                </button>
            </div>
        </form>

        <!-- 生成されたJSON表示エリア -->
        <section class="section hidden" id="jsonOutput">
            <h2 class="section-title">📄 生成されたJSON</h2>
            <textarea class="form-input" id="jsonText" rows="15" readonly
                style="font-family: monospace; font-size: 0.875rem;"></textarea>
            <div style="margin-top: var(--space-4);">
                <button type="button" class="btn btn-secondary" onclick="copyJson()">
                    📋 JSONをコピー
                </button>
            </div>
        </section>
    </main>

    <script>
        // テーマ切り替え機能
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            updateThemeButton(theme);
        }

        function updateThemeButton(theme) {
            const icon = document.getElementById('theme-icon');
            icon.textContent = theme === 'dark' ? '🌙' : '☀️';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            setTheme(currentTheme === 'light' ? 'dark' : 'light');
        }

        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                setTheme('light');
            }
        })();

        // デフォルトの日本語ソース
        const japaneseSources = [
            { name: "ITmedia AI+", url: "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml", language: "ja", enabled: true, isDefault: true },
            { name: "ITmedia NEWS", url: "https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml", language: "ja", enabled: true, isDefault: true },
            { name: "GIGAZINE", url: "https://gigazine.net/news/rss_2.0/", language: "ja", enabled: true, isDefault: true },
            { name: "Impress Watch", url: "https://www.watch.impress.co.jp/data/rss/1.0/ipw/feed.rdf", language: "ja", enabled: true, isDefault: true },
            { name: "日経クロステック", url: "https://xtech.nikkei.com/rss/xtech-ai.rdf", language: "ja", enabled: true, isDefault: true },
            { name: "ASCII.jp", url: "https://ascii.jp/rss.xml", language: "ja", enabled: true, isDefault: true },
            { name: "CNET Japan", url: "https://japan.cnet.com/rss/index.rdf", language: "ja", enabled: true, isDefault: true },
            { name: "ZDNet Japan", url: "https://japan.zdnet.com/rss/index.rdf", language: "ja", enabled: true, isDefault: true },
        ];

        // デフォルトの英語ソース
        const englishSources = [
            { name: "TechCrunch AI", url: "https://techcrunch.com/category/artificial-intelligence/feed/", language: "en", enabled: true, isDefault: true },
            { name: "VentureBeat AI", url: "https://venturebeat.com/category/ai/feed/", language: "en", enabled: true, isDefault: true },
            { name: "The Verge AI", url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", language: "en", enabled: true, isDefault: true },
            { name: "MIT Technology Review", url: "https://www.technologyreview.com/feed/", language: "en", enabled: true, isDefault: true },
            { name: "Wired AI", url: "https://www.wired.com/feed/tag/ai/latest/rss", language: "en", enabled: true, isDefault: true },
            { name: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/technology-lab", language: "en", enabled: true, isDefault: true },
            { name: "Google AI Blog", url: "https://blog.google/technology/ai/rss/", language: "en", enabled: true, isDefault: true },
        ];

        // カスタムソース（ローカルストレージから読み込み）
        let customSources = JSON.parse(localStorage.getItem('customSources') || '[]');

        // 現在のタブ
        let currentTab = 'ja';

        // タブ切り替え
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                renderSources();
            });
        });

        // ソースリストを描画
        function renderSources() {
            const list = document.getElementById('sourceList');
            let sources = [];

            if (currentTab === 'ja') {
                sources = japaneseSources;
            } else if (currentTab === 'en') {
                sources = englishSources;
            } else {
                sources = customSources;
            }

            if (sources.length === 0 && currentTab === 'custom') {
                list.innerHTML = '<p style="color: var(--dads-text-muted); padding: var(--space-4); text-align: center;">カスタムソースはまだ追加されていません。<br>下のフォームから追加してください。</p>';
                return;
            }

            list.innerHTML = sources.map((source, index) => `
                <li class="source-item ${source.isDefault ? '' : 'custom'}">
                    <input type="checkbox" class="source-checkbox" 
                           id="${currentTab}_source${index}" 
                           data-tab="${currentTab}"
                           data-index="${index}"
                           ${source.enabled ? 'checked' : ''}
                           onchange="toggleSource('${currentTab}', ${index})">
                    <div class="source-info">
                        <div class="source-name">${source.name}</div>
                        <div class="source-url">${source.url}</div>
                    </div>
                    <span class="source-lang ${source.language}">${source.language === 'ja' ? '🇯🇵 日本語' : '🌐 English'}</span>
                    ${!source.isDefault ? `<button type="button" class="source-delete" onclick="deleteCustomSource(${index})">🗑️</button>` : ''}
                </li>
            `).join('');
        }

        // ソースの有効/無効を切り替え
        function toggleSource(tab, index) {
            if (tab === 'ja') {
                japaneseSources[index].enabled = !japaneseSources[index].enabled;
            } else if (tab === 'en') {
                englishSources[index].enabled = !englishSources[index].enabled;
            } else {
                customSources[index].enabled = !customSources[index].enabled;
                saveCustomSources();
            }
        }

        // カスタムソースを追加
        function addCustomSource() {
            const name = document.getElementById('newSourceName').value.trim();
            const url = document.getElementById('newSourceUrl').value.trim();
            const language = document.getElementById('newSourceLang').value;

            if (!name || !url) {
                alert('ソース名とURLを入力してください');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                alert('有効なURLを入力してください');
                return;
            }

            customSources.push({
                name: name,
                url: url,
                language: language,
                enabled: true,
                isDefault: false
            });

            saveCustomSources();

            document.getElementById('newSourceName').value = '';
            document.getElementById('newSourceUrl').value = '';

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.tab-btn[data-tab="custom"]').classList.add('active');
            currentTab = 'custom';
            renderSources();

            alert('ソースを追加しました！');
        }

        // カスタムソースを削除
        function deleteCustomSource(index) {
            if (confirm('このソースを削除しますか？')) {
                customSources.splice(index, 1);
                saveCustomSources();
                renderSources();
            }
        }

        // カスタムソースをローカルストレージに保存
        function saveCustomSources() {
            localStorage.setItem('customSources', JSON.stringify(customSources));
        }

        // 設定をJSONに変換
        function generateJson() {
            const hour = parseInt(document.getElementById('scheduleHour').value);
            const minute = parseInt(document.getElementById('scheduleMinute').value);
            const maxArticles = parseInt(document.getElementById('maxArticles').value);

            const allSources = [...japaneseSources, ...englishSources, ...customSources];
            const enabledSources = allSources
                .filter(source => source.enabled)
                .map(source => ({
                    name: source.name,
                    url: source.url,
                    language: source.language,
                    priority: source.language === 'ja' ? 1 : 2
                }));

            const config = {
                schedule: {
                    hour: hour,
                    minute: minute,
                    timezone: "Asia/Tokyo"
                },
                output: {
                    max_articles: maxArticles,
                    language: "ja"
                },
                sources: enabledSources,
                scoring: {
                    keywords: {
                        high_priority: [
                            "OpenAI", "GPT-5", "GPT-4", "ChatGPT", "DALL-E", "Sora",
                            "Google", "Gemini", "DeepMind", "Bard",
                            "Anthropic", "Claude",
                            "Meta", "Llama",
                            "Microsoft", "Copilot",
                            "breakthrough", "ブレークスルー", "革新",
                            "launch", "release", "発表", "リリース", "公開",
                            "AGI", "人工汎用知能"
                        ],
                        medium_priority: [
                            "LLM", "大規模言語モデル",
                            "transformer", "トランスフォーマー",
                            "diffusion", "拡散モデル",
                            "fine-tuning", "ファインチューニング",
                            "RAG", "retrieval",
                            "agent", "エージェント",
                            "multimodal", "マルチモーダル"
                        ],
                        company_names: [
                            "OpenAI", "Google", "Anthropic", "Meta", "Microsoft",
                            "NVIDIA", "Amazon", "Apple", "Hugging Face", "Stability AI"
                        ]
                    },
                    weights: {
                        high_priority_keyword: 10,
                        medium_priority_keyword: 5,
                        company_name: 8,
                        recency_24h: 10,
                        recency_48h: 5,
                        japanese_source: 5
                    }
                }
            };

            return JSON.stringify(config, null, 2);
        }

        // フォーム送信
        document.getElementById('settingsForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const json = generateJson();
            document.getElementById('jsonText').value = json;
            document.getElementById('jsonOutput').classList.remove('hidden');
            document.getElementById('saveAlert').classList.remove('hidden');

            document.getElementById('jsonOutput').scrollIntoView({ behavior: 'smooth' });
        });

        // JSONをコピー
        function copyJson() {
            const textarea = document.getElementById('jsonText');
            textarea.select();
            document.execCommand('copy');
            alert('JSONをクリップボードにコピーしました！');
        }

        // リセット
        function resetSettings() {
            document.getElementById('scheduleHour').value = 6;
            document.getElementById('scheduleMinute').value = 0;
            document.getElementById('maxArticles').value = 5;
            document.getElementById('hoursLimit').value = 48;

            japaneseSources.forEach(s => s.enabled = true);
            englishSources.forEach(s => s.enabled = true);
            customSources = [];
            saveCustomSources();

            document.getElementById('jsonOutput').classList.add('hidden');
            document.getElementById('saveAlert').classList.add('hidden');

            renderSources();
        }

        // 初期化
        renderSources();
    </script>
</body>

</html>
