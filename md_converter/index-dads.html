<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Converter - マークダウン変換ツール</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       CSS Variables - DADS Color System
    ============================================ */
    :root {
      /* Primary Colors */
      --dads-primary-500: #0071c1;
      --dads-primary-600: #005a9e;
      --dads-primary-700: #004578;

      /* Text Colors */
      --dads-text-primary: #212529;
      --dads-text-secondary: #6c757d;
      --dads-text-link: #0071c1;

      /* Background Colors */
      --dads-bg-primary: #ffffff;
      --dads-bg-secondary: #f8f9fa;
      --dads-bg-tertiary: #e9ecef;

      /* Border Colors */
      --dads-border-default: #ced4da;
      --dads-border-focus: #0071c1;

      /* Semantic Colors */
      --dads-error: #dc3545;
      --dads-success: #28a745;
      --dads-warning: #ffc107;

      /* Spacing (8px grid) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 40px;
      --space-8: 48px;

      /* Border Radius */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;

      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 10px 24px rgba(0, 0, 0, 0.1);

      /* Transition */
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
    }

    /* Dark Mode Variables */
    .dark-mode {
      --dads-text-primary: #f8f9fa;
      --dads-text-secondary: #adb5bd;
      --dads-text-link: #66b3ff;
      --dads-bg-primary: #1a1d21;
      --dads-bg-secondary: #212529;
      --dads-bg-tertiary: #343a40;
      --dads-border-default: #495057;
      --dads-border-focus: #66b3ff;
      --dads-primary-500: #66b3ff;
    }

    /* ============================================
       Base Styles
    ============================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--dads-text-primary);
      background: var(--dads-bg-secondary);
      min-height: 100vh;
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    /* Skip Link for Accessibility */
    .skip-link {
      position: absolute;
      top: -100%;
      left: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--dads-primary-500);
      color: #fff;
      border-radius: var(--radius-sm);
      z-index: 9999;
      text-decoration: none;
      font-weight: 500;
    }

    .skip-link:focus {
      top: var(--space-4);
    }

    /* ============================================
       Layout
    ============================================ */
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-6);
      background: var(--dads-bg-primary);
      border-bottom: 1px solid var(--dads-border-default);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--dads-text-primary);
    }

    .header-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--dads-primary-500), var(--dads-primary-700));
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 1rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    /* Icon Buttons */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid var(--dads-border-default);
      border-radius: var(--radius-sm);
      color: var(--dads-text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-size: 1.125rem;
    }

    .icon-btn:hover {
      background: var(--dads-bg-tertiary);
      color: var(--dads-text-primary);
    }

    .icon-btn:focus-visible {
      outline: 3px solid var(--dads-primary-500);
      outline-offset: 2px;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--space-5);
      gap: var(--space-4);
    }

    /* Converter Panels */
    .converter-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-5);
      min-height: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      background: var(--dads-bg-primary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      min-height: 400px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      background: var(--dads-bg-secondary);
      border-bottom: 1px solid var(--dads-border-default);
    }

    .panel-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--dads-text-secondary);
    }

    .panel-badge {
      padding: var(--space-1) var(--space-2);
      background: var(--dads-primary-500);
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .panel-badge.text-badge {
      background: var(--dads-success);
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: transparent;
      border: 1px solid var(--dads-border-default);
      border-radius: var(--radius-sm);
      color: var(--dads-text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .copy-btn:hover {
      background: var(--dads-bg-tertiary);
      color: var(--dads-text-primary);
    }

    .copy-btn:focus-visible {
      outline: 3px solid var(--dads-primary-500);
      outline-offset: 2px;
    }

    .copy-btn.copied {
      background: var(--dads-success);
      border-color: var(--dads-success);
      color: #fff;
    }

    .panel-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--space-4);
    }

    .text-area {
      flex: 1;
      width: 100%;
      min-height: 300px;
      padding: var(--space-4);
      background: var(--dads-bg-primary);
      border: 2px solid var(--dads-border-default);
      border-radius: var(--radius-md);
      font-family: 'Noto Sans JP', monospace;
      font-size: 0.9375rem;
      line-height: 1.8;
      color: var(--dads-text-primary);
      resize: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .text-area:focus {
      outline: none;
      border-color: var(--dads-border-focus);
      box-shadow: 0 0 0 3px rgba(0, 113, 193, 0.15);
    }

    .text-area::placeholder {
      color: var(--dads-text-secondary);
    }

    .text-area.active-input {
      border-color: var(--dads-primary-500);
      background: rgba(0, 113, 193, 0.02);
    }

    /* Direction Indicator */
    .direction-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2) 0;
    }

    .direction-arrow {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      background: var(--dads-bg-tertiary);
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      color: var(--dads-text-secondary);
      transition: all var(--transition-fast);
    }

    .direction-arrow.md-to-text {
      color: var(--dads-primary-500);
    }

    .direction-arrow.text-to-md {
      color: var(--dads-success);
    }

    /* ============================================
       Settings Modal
    ============================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--transition-normal), visibility var(--transition-normal);
      padding: var(--space-5);
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 100%;
      max-width: 720px;
      max-height: 80vh;
      background: var(--dads-bg-primary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      transform: scale(0.95) translateY(10px);
      transition: transform var(--transition-normal);
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-5);
      border-bottom: 1px solid var(--dads-border-default);
    }

    .modal-header h2 {
      font-size: 1.125rem;
      font-weight: 700;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--dads-text-secondary);
      cursor: pointer;
      font-size: 1.25rem;
      transition: all var(--transition-fast);
    }

    .modal-close:hover {
      background: var(--dads-bg-tertiary);
      color: var(--dads-text-primary);
    }

    .modal-close:focus-visible {
      outline: 3px solid var(--dads-primary-500);
      outline-offset: 2px;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-5);
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      border-top: 1px solid var(--dads-border-default);
      gap: var(--space-3);
    }

    /* Rules Table */
    .rules-table {
      width: 100%;
      border-collapse: collapse;
    }

    .rules-table th,
    .rules-table td {
      padding: var(--space-3) var(--space-4);
      text-align: left;
      border-bottom: 1px solid var(--dads-border-default);
    }

    .rules-table th {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--dads-text-secondary);
      background: var(--dads-bg-secondary);
    }

    .rules-table td {
      font-size: 0.875rem;
    }

    .rules-table tbody tr:hover {
      background: var(--dads-bg-secondary);
    }

    .rule-input {
      width: 100%;
      padding: var(--space-2) var(--space-3);
      background: var(--dads-bg-primary);
      border: 1px solid var(--dads-border-default);
      border-radius: var(--radius-sm);
      font-family: 'Noto Sans JP', monospace;
      font-size: 0.875rem;
      color: var(--dads-text-primary);
      transition: border-color var(--transition-fast);
    }

    .rule-input:focus {
      outline: none;
      border-color: var(--dads-border-focus);
    }

    .rule-toggle {
      appearance: none;
      width: 44px;
      height: 24px;
      background: var(--dads-border-default);
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transition: background var(--transition-fast);
    }

    .rule-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform var(--transition-fast);
    }

    .rule-toggle:checked {
      background: var(--dads-primary-500);
    }

    .rule-toggle:checked::after {
      transform: translateX(20px);
    }

    .rule-toggle:focus-visible {
      outline: 3px solid var(--dads-primary-500);
      outline-offset: 2px;
    }

    .delete-rule-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--dads-border-default);
      border-radius: var(--radius-sm);
      color: var(--dads-error);
      cursor: pointer;
      font-size: 1rem;
      transition: all var(--transition-fast);
    }

    .delete-rule-btn:hover {
      background: var(--dads-error);
      border-color: var(--dads-error);
      color: #fff;
    }

    .delete-rule-btn:focus-visible {
      outline: 3px solid var(--dads-error);
      outline-offset: 2px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);
      min-height: 44px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn:focus-visible {
      outline: 3px solid var(--dads-primary-500);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--dads-primary-500);
      border: 2px solid var(--dads-primary-500);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--dads-primary-600);
      border-color: var(--dads-primary-600);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--dads-border-default);
      color: var(--dads-text-primary);
    }

    .btn-secondary:hover {
      background: var(--dads-bg-tertiary);
    }

    .btn-danger {
      background: transparent;
      border: 2px solid var(--dads-error);
      color: var(--dads-error);
    }

    .btn-danger:hover {
      background: var(--dads-error);
      color: #fff;
    }

    /* Add Rule Form */
    .add-rule-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: var(--space-3);
      padding: var(--space-4);
      background: var(--dads-bg-secondary);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-4);
    }

    .add-rule-form .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .add-rule-form label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--dads-text-secondary);
    }

    .add-rule-btn {
      align-self: flex-end;
    }

    /* ============================================
       Toast Notification
    ============================================ */
    .toast {
      position: fixed;
      bottom: var(--space-5);
      right: var(--space-5);
      padding: var(--space-4) var(--space-5);
      background: var(--dads-text-primary);
      color: var(--dads-bg-primary);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 0.875rem;
      font-weight: 500;
      transform: translateY(100px);
      opacity: 0;
      transition: all var(--transition-normal);
      z-index: 1001;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ============================================
       Responsive Design
    ============================================ */
    @media (max-width: 768px) {
      .header {
        padding: var(--space-3) var(--space-4);
      }

      .header-title h1 {
        font-size: 1rem;
      }

      .main-content {
        padding: var(--space-4);
      }

      .converter-wrapper {
        grid-template-columns: 1fr;
      }

      .panel {
        min-height: 280px;
      }

      .direction-indicator {
        transform: rotate(90deg);
      }

      .add-rule-form {
        grid-template-columns: 1fr;
      }

      .add-rule-btn {
        width: 100%;
      }

      .modal-footer {
        flex-direction: column;
      }

      .modal-footer .btn {
        width: 100%;
      }
    }

    /* ============================================
       Utility Classes
    ============================================ */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- Skip Link -->
  <a href="#main-content" class="skip-link">本文へスキップ</a>

  <div class="app-container">
    <!-- Header -->
    <header class="header" role="banner">
      <div class="header-title">
        <div class="header-icon" aria-hidden="true">⇄</div>
        <h1>MD Converter</h1>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="darkModeToggle" aria-label="ダークモード切り替え" title="ダークモード切り替え">
          🌙
        </button>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="設定を開く" title="設定">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="main-content" role="main">
      <div class="converter-wrapper">
        <!-- Markdown Panel -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-label">
              <span class="panel-badge">MD</span>
              <span>Markdown</span>
            </div>
            <button type="button" class="copy-btn" data-target="mdInput" aria-label="Markdownをコピー">
              📋 コピー
            </button>
          </div>
          <div class="panel-body">
            <label for="mdInput" class="sr-only">Markdownテキストを入力</label>
            <textarea
              id="mdInput"
              class="text-area"
              placeholder="Markdownを入力...&#10;&#10;例:&#10;## 見出し2&#10;### 見出し3&#10;- リスト項目&#10;- [ ] 未完了タスク&#10;- [x] 完了タスク&#10;> 引用文&#10;**太字テキスト**&#10;`インラインコード`"
              spellcheck="false"
            ></textarea>
          </div>
        </div>

        <!-- Text Panel -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-label">
              <span class="panel-badge text-badge">TEXT</span>
              <span>一般テキスト</span>
            </div>
            <button type="button" class="copy-btn" data-target="textInput" aria-label="テキストをコピー">
              📋 コピー
            </button>
          </div>
          <div class="panel-body">
            <label for="textInput" class="sr-only">一般テキストを入力</label>
            <textarea
              id="textInput"
              class="text-area"
              placeholder="一般テキストを入力...&#10;&#10;例:&#10;■ 見出し2&#10;● 見出し3&#10;・リスト項目&#10;□ 未完了タスク&#10;✓ 完了タスク&#10;│ 引用文&#10;【太字テキスト】&#10;「インラインコード」"
              spellcheck="false"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Direction Indicator -->
      <div class="direction-indicator">
        <div class="direction-arrow" id="directionArrow">
          <span id="directionText">編集中のパネルから変換</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">変換ルール設定</h2>
        <button type="button" class="modal-close" id="closeModal" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <!-- Add Rule Form -->
        <form class="add-rule-form" id="addRuleForm">
          <div class="form-group">
            <label for="newMdPattern">Markdown パターン</label>
            <input type="text" id="newMdPattern" class="rule-input" placeholder="例: ## ">
          </div>
          <div class="form-group">
            <label for="newTextPattern">一般テキスト</label>
            <input type="text" id="newTextPattern" class="rule-input" placeholder="例: ◽️ ">
          </div>
          <button type="submit" class="btn btn-primary add-rule-btn">追加</button>
        </form>

        <!-- Rules Table -->
        <table class="rules-table" aria-label="変換ルール一覧">
          <thead>
            <tr>
              <th scope="col">Markdown</th>
              <th scope="col">一般テキスト</th>
              <th scope="col">有効</th>
              <th scope="col"><span class="sr-only">操作</span></th>
            </tr>
          </thead>
          <tbody id="rulesTableBody">
            <!-- Rules will be populated by JS -->
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="resetRulesBtn">初期設定に戻す</button>
        <button type="button" class="btn btn-secondary" id="closeModalBtn">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* ============================================
       Constants & Default Rules
    ============================================ */
    const STORAGE_KEY = 'md_converter_rules_v1';
    const THEME_KEY = 'md_converter_theme';

    const DEFAULT_RULES = [
      { md: '#### ', text: '○ ', enabled: true, isRegex: false },
      { md: '### ', text: '● ', enabled: true, isRegex: false },
      { md: '## ', text: '■ ', enabled: true, isRegex: false },
      { md: '- [x] ', text: '✓ ', enabled: true, isRegex: false },
      { md: '- [ ] ', text: '□ ', enabled: true, isRegex: false },
      { md: '- ', text: '・', enabled: true, isRegex: false },
      { md: '* ', text: '・', enabled: true, isRegex: false },
      { md: '> ', text: '│ ', enabled: true, isRegex: false },
      { md: '1. ', text: '① ', enabled: true, isRegex: false },
      { md: '2. ', text: '② ', enabled: true, isRegex: false },
      { md: '3. ', text: '③ ', enabled: true, isRegex: false },
      { md: '4. ', text: '④ ', enabled: true, isRegex: false },
      { md: '5. ', text: '⑤ ', enabled: true, isRegex: false },
      { md: '6. ', text: '⑥ ', enabled: true, isRegex: false },
      { md: '7. ', text: '⑦ ', enabled: true, isRegex: false },
      { md: '8. ', text: '⑧ ', enabled: true, isRegex: false },
      { md: '9. ', text: '⑨ ', enabled: true, isRegex: false },
      { md: '`([^`]+)`', text: '「$1」', enabled: true, isRegex: true },
      { md: '\\*\\*([^*]+)\\*\\*', text: '【$1】', enabled: true, isRegex: true },
    ];

    /* ============================================
       State
    ============================================ */
    let rules = [];
    let isConverting = false;
    let lastActiveInput = null;

    /* ============================================
       DOM Elements
    ============================================ */
    const mdInput = document.getElementById('mdInput');
    const textInput = document.getElementById('textInput');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeModal = document.getElementById('closeModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const rulesTableBody = document.getElementById('rulesTableBody');
    const addRuleForm = document.getElementById('addRuleForm');
    const resetRulesBtn = document.getElementById('resetRulesBtn');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const directionArrow = document.getElementById('directionArrow');
    const directionText = document.getElementById('directionText');
    const toast = document.getElementById('toast');

    /* ============================================
       Storage Functions
    ============================================ */
    function loadRules() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          rules = JSON.parse(stored);
        } else {
          rules = JSON.parse(JSON.stringify(DEFAULT_RULES));
        }
      } catch (e) {
        console.error('Failed to load rules:', e);
        rules = JSON.parse(JSON.stringify(DEFAULT_RULES));
      }
    }

    function saveRules() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(rules));
      } catch (e) {
        console.error('Failed to save rules:', e);
      }
    }

    function loadTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        darkModeToggle.textContent = '☀️';
      }
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      darkModeToggle.textContent = isDark ? '☀️' : '🌙';
    }

    /* ============================================
       Conversion Functions
    ============================================ */
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function convertMdToText(input) {
      let result = input;

      // Process line by line for non-regex rules, then apply regex rules
      const lines = result.split('\n');
      const processedLines = lines.map(line => {
        let processedLine = line;

        // Apply non-regex rules (line start patterns)
        for (const rule of rules) {
          if (!rule.enabled || rule.isRegex) continue;

          if (processedLine.startsWith(rule.md)) {
            processedLine = rule.text + processedLine.slice(rule.md.length);
            break; // Only apply one line-start rule per line
          }
        }

        return processedLine;
      });

      result = processedLines.join('\n');

      // Apply regex rules (inline patterns)
      for (const rule of rules) {
        if (!rule.enabled || !rule.isRegex) continue;

        try {
          const regex = new RegExp(rule.md, 'g');
          result = result.replace(regex, rule.text);
        } catch (e) {
          console.error('Invalid regex:', rule.md, e);
        }
      }

      return result;
    }

    function convertTextToMd(input) {
      let result = input;

      // Process line by line for non-regex rules
      const lines = result.split('\n');
      const processedLines = lines.map(line => {
        let processedLine = line;

        // Apply non-regex rules (reverse: text to md)
        for (const rule of rules) {
          if (!rule.enabled || rule.isRegex) continue;

          if (processedLine.startsWith(rule.text)) {
            processedLine = rule.md + processedLine.slice(rule.text.length);
            break;
          }
        }

        return processedLine;
      });

      result = processedLines.join('\n');

      // Apply reverse regex rules (inline patterns)
      for (const rule of rules) {
        if (!rule.enabled || !rule.isRegex) continue;

        try {
          // Create reverse pattern from text to md
          // For patterns like 「$1」 -> `$1`
          const textPattern = rule.text
            .replace(/\$/g, '\\$')
            .replace(/\\\\\\$1/g, '(.+?)')
            .replace(/[「」【】]/g, (match) => escapeRegExp(match))
            .replace(/\\\$1/g, '(.+?)');

          // Reconstruct md pattern
          let mdReplacement = rule.md;
          if (rule.md.includes('([^`]+)')) {
            // Inline code pattern
            const reverseRegex = /「([^」]+)」/g;
            result = result.replace(reverseRegex, '`$1`');
          } else if (rule.md.includes('([^*]+)')) {
            // Bold pattern
            const reverseRegex = /【([^】]+)】/g;
            result = result.replace(reverseRegex, '**$1**');
          }
        } catch (e) {
          console.error('Reverse regex error:', rule.text, e);
        }
      }

      return result;
    }

    /* ============================================
       UI Functions
    ============================================ */
    function updateDirectionIndicator(direction) {
      directionArrow.classList.remove('md-to-text', 'text-to-md');

      if (direction === 'md-to-text') {
        directionArrow.classList.add('md-to-text');
        directionText.textContent = 'MD → テキスト';
      } else if (direction === 'text-to-md') {
        directionArrow.classList.add('text-to-md');
        directionText.textContent = 'テキスト → MD';
      } else {
        directionText.textContent = '編集中のパネルから変換';
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function renderRulesTable() {
      rulesTableBody.innerHTML = '';

      rules.forEach((rule, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <input type="text" class="rule-input" value="${escapeHtml(rule.md)}"
                   data-index="${index}" data-field="md" aria-label="Markdownパターン">
          </td>
          <td>
            <input type="text" class="rule-input" value="${escapeHtml(rule.text)}"
                   data-index="${index}" data-field="text" aria-label="一般テキストパターン">
          </td>
          <td>
            <input type="checkbox" class="rule-toggle" ${rule.enabled ? 'checked' : ''}
                   data-index="${index}" aria-label="ルールを有効化">
          </td>
          <td>
            <button type="button" class="delete-rule-btn" data-index="${index}"
                    aria-label="ルールを削除">🗑</button>
          </td>
        `;
        rulesTableBody.appendChild(tr);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /* ============================================
       Event Handlers
    ============================================ */
    function handleMdInput() {
      if (isConverting) return;
      isConverting = true;

      lastActiveInput = 'md';
      mdInput.classList.add('active-input');
      textInput.classList.remove('active-input');
      updateDirectionIndicator('md-to-text');

      textInput.value = convertMdToText(mdInput.value);

      isConverting = false;
    }

    function handleTextInput() {
      if (isConverting) return;
      isConverting = true;

      lastActiveInput = 'text';
      textInput.classList.add('active-input');
      mdInput.classList.remove('active-input');
      updateDirectionIndicator('text-to-md');

      mdInput.value = convertTextToMd(textInput.value);

      isConverting = false;
    }

    function handleCopyClick(e) {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;

      const targetId = btn.dataset.target;
      const targetElement = document.getElementById(targetId);

      if (targetElement && targetElement.value) {
        navigator.clipboard.writeText(targetElement.value).then(() => {
          btn.classList.add('copied');
          btn.innerHTML = '✓ コピー完了';

          setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '📋 コピー';
          }, 2000);
        }).catch(() => {
          showToast('コピーに失敗しました');
        });
      }
    }

    function handleRuleTableChange(e) {
      const target = e.target;
      const index = parseInt(target.dataset.index, 10);

      if (target.classList.contains('rule-input')) {
        const field = target.dataset.field;
        rules[index][field] = target.value;
        saveRules();

        // Re-convert if there's content
        if (lastActiveInput === 'md') {
          handleMdInput();
        } else if (lastActiveInput === 'text') {
          handleTextInput();
        }
      } else if (target.classList.contains('rule-toggle')) {
        rules[index].enabled = target.checked;
        saveRules();

        if (lastActiveInput === 'md') {
          handleMdInput();
        } else if (lastActiveInput === 'text') {
          handleTextInput();
        }
      }
    }

    function handleDeleteRule(e) {
      const btn = e.target.closest('.delete-rule-btn');
      if (!btn) return;

      const index = parseInt(btn.dataset.index, 10);
      rules.splice(index, 1);
      saveRules();
      renderRulesTable();
      showToast('ルールを削除しました');
    }

    function handleAddRule(e) {
      e.preventDefault();

      const mdPattern = document.getElementById('newMdPattern').value.trim();
      const textPattern = document.getElementById('newTextPattern').value.trim();

      if (!mdPattern || !textPattern) {
        showToast('両方のパターンを入力してください');
        return;
      }

      rules.push({
        md: mdPattern,
        text: textPattern,
        enabled: true,
        isRegex: false
      });

      saveRules();
      renderRulesTable();

      document.getElementById('newMdPattern').value = '';
      document.getElementById('newTextPattern').value = '';

      showToast('ルールを追加しました');
    }

    function handleResetRules() {
      if (confirm('すべてのルールを初期設定に戻しますか？')) {
        rules = JSON.parse(JSON.stringify(DEFAULT_RULES));
        saveRules();
        renderRulesTable();
        showToast('初期設定に戻しました');

        if (lastActiveInput === 'md') {
          handleMdInput();
        } else if (lastActiveInput === 'text') {
          handleTextInput();
        }
      }
    }

    function openModal() {
      settingsModal.classList.add('active');
      closeModal.focus();
    }

    function closeModalFn() {
      settingsModal.classList.remove('active');
      settingsBtn.focus();
    }

    function handleModalKeydown(e) {
      if (e.key === 'Escape') {
        closeModalFn();
      }
    }

    function handleModalOverlayClick(e) {
      if (e.target === settingsModal) {
        closeModalFn();
      }
    }

    /* ============================================
       Initialize
    ============================================ */
    function init() {
      // Load saved data
      loadRules();
      loadTheme();
      renderRulesTable();

      // Event listeners for conversion
      mdInput.addEventListener('input', handleMdInput);
      textInput.addEventListener('input', handleTextInput);

      // Copy buttons
      document.addEventListener('click', handleCopyClick);

      // Settings modal
      settingsBtn.addEventListener('click', openModal);
      closeModal.addEventListener('click', closeModalFn);
      closeModalBtn.addEventListener('click', closeModalFn);
      settingsModal.addEventListener('click', handleModalOverlayClick);
      settingsModal.addEventListener('keydown', handleModalKeydown);

      // Rules table
      rulesTableBody.addEventListener('input', handleRuleTableChange);
      rulesTableBody.addEventListener('click', handleDeleteRule);

      // Add rule form
      addRuleForm.addEventListener('submit', handleAddRule);

      // Reset rules
      resetRulesBtn.addEventListener('click', handleResetRules);

      // Dark mode toggle
      darkModeToggle.addEventListener('click', toggleTheme);
    }

    // Start the app
    init();
  </script>
</body>
</html>
